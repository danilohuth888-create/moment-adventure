<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#14111b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOMENT">
  <meta name="description" content="MOMENT v0.4 — Offline Pixel-Fantasy-RPG im Survivors-Stil.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>MOMENT — Pixel Adventure</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-screen="home">
  <div id="frame">
    <canvas id="game" aria-label="Spielwelt"></canvas>
    <header id="hud" class="hidden">
      <div class="hud-block left">
        <div class="hud-line"><span id="class-label">ARKANIST</span><span id="level">LV 1</span></div>
        <div class="bar pixel health"><div id="health-fill" class="fill"></div><span id="hp-label">100/100</span></div>
        <div class="bar pixel xp"><div id="xp-fill" class="fill"></div></div>
      </div>
      <div class="hud-block right">
        <div class="hud-line"><span id="area-label">WALD I</span><span id="room-label">RAUM 1/5</span></div>
        <div class="hud-line small"><span id="coins">GOLD 0</span><span id="kill-label">0 / 12</span></div>
      </div>
      <button id="pause" class="pixel-btn icon">II</button>
    </header>

    <div id="combat-ui" class="hidden">
      <div id="joy-zone">
        <div id="joy-ring"><div id="joy-stick"></div></div>
        <span class="caption">MOVE</span>
      </div>
      <div id="actions">
        <button id="dash" class="action pixel-btn"><span class="glyph">⇢</span><small>DASH</small></button>
        <button id="skill" class="action pixel-btn"><span class="glyph">✦</span><small id="skill-timer">SKILL</small></button>
      </div>
    </div>

    <div id="toast" class="hidden" role="status" aria-live="polite"></div>

    <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <div id="main-shell">
        <div class="topbar"><span>MOMENT // PIXEL ADVENTURE</span><span class="tag">OFFLINE</span></div>
        <section id="panel" class="panel"><h1 id="panel-title">MOMENT</h1><p>PIXEL-FANTASY FÜR JEDERZEIT.</p></section>
        <div class="bottombar"><span>PIXEL BUILD v0.4</span><span>NO ADS · LOCAL SAVE</span></div>
      </div>
    </div>

    <input id="import-save" type="file" accept=".json,application/json" hidden>
  </div>
  <script src="./game.js" defer></script>
</body>
</html>
