<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101923">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOMENT">
  <meta name="description" content="Ein magisches Fantasy-Abenteuer für deine Hosentasche. Offline spielbar.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>MOMENT · Realms of Adventure</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game" aria-label="Spielfeld: Bewege deinen Helden mit dem Joystick und weiche Gegnern aus"></canvas>
  <div id="vignette" aria-hidden="true"></div>
  <header id="hud" class="hidden">
    <div class="hud-l">
      <div class="hero-meta"><span id="class-icon">✦</span> <span id="class-label">Arkanist</span> <span id="level">LV 1</span></div>
      <div class="bar-shell health"><div id="health-fill" class="bar-fill"></div><span id="hp-label">100 / 100</span></div>
      <div class="bar-shell experience"><div id="xp-fill" class="bar-fill"></div></div>
    </div>
    <div class="hud-r"><span id="area-label">DIE ZUFLUCHT</span><span id="room-label">WALD · 1 / 5</span><span id="coins">✦ 0</span></div>
    <button id="pause" class="round-btn" aria-label="Pause">Ⅱ</button>
  </header>
  <div id="combat-ui" class="hidden">
    <div id="joy-zone" aria-label="Bewegungsjoystick"><div id="joy-ring"><div id="joy-stick"></div></div></div>
    <div id="actions"><button id="dash" class="action-button dash" aria-label="Ausweichen">➤<small>SPRINT</small></button><button id="skill" class="action-button skill" aria-label="Spezialfähigkeit">✧<small id="skill-timer">MAGIE</small></button></div>
  </div>
  <div id="toast" role="status" aria-live="polite" class="hidden"></div>
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <section id="panel" class="panel"><h1 id="panel-title">MOMENT</h1><p>Dein Abenteuer beginnt.</p></section>
  </div>
  <input id="import-save" type="file" accept=".json,application/json" hidden>
  <script src="./game.js" defer></script>
</body>
</html>
