<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10111d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOMENT">
  <meta name="description" content="MOMENT — ein echtes Pixel-Fantasy-Survivors-RPG für dein Handy. Komplett offline, ohne Werbung und Konto.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>MOMENT · Aetheria</title>
</head>
<body>
  <main id="app" aria-label="MOMENT Pixel-RPG">
    <canvas id="world" aria-label="Pixel-Spielwelt"></canvas>
    <div id="shade"></div>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hero-hud">
          <div class="hero-portrait" id="hero-portrait">✦</div>
          <div class="hero-bars">
            <div class="hud-names"><span id="hud-class">ARKANIST</span><span id="hud-level">LV 1</span></div>
            <div class="meter meter-hp"><div id="hp-fill" class="meter-fill"></div><span id="hp-text">100/100</span></div>
            <div class="meter meter-xp"><div id="xp-fill" class="meter-fill"></div></div>
          </div>
        </div>
        <div class="hud-right"><div id="hud-time">00:00</div><div id="hud-kills">0 BESIEGT</div><button id="pause-button" class="pixel-icon-btn" aria-label="Pausieren">Ⅱ</button></div>
      </div>
      <div class="hud-progress"><span id="hud-world">01 · FLÜSTERWALD</span><span id="hud-wave">WELLE 1</span></div>
      <div id="boss-bar" class="boss-bar hidden"><span id="boss-name">BOSS</span><div class="meter meter-boss"><div id="boss-fill" class="meter-fill"></div></div></div>
    </div>
    <div id="controls" class="hidden">
      <div id="joystick" role="group" aria-label="Bewegung"><div id="joystick-knob"></div></div>
      <div class="controls-right"><button id="dash-button" class="ability ability-dash" aria-label="Sprinten"><span class="ability-symbol">↗</span><small id="dash-label">SPRINT</small></button><button id="ultimate-button" class="ability ability-ultimate" aria-label="Spezialangriff"><span class="ability-symbol">✧</span><small id="ultimate-label">ULTI</small></button></div>
    </div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="overlay" class="overlay">
      <div class="shell">
        <div class="top-strip"><span class="brand-mini">✦ MOMENT <span class="muted">/ AETHERIA</span></span><span id="offline-status" class="offline-tag">● OFFLINE-PAKET</span></div>
        <section id="screen" class="screen" aria-live="off"></section>
        <div class="bottom-strip"><span>REALMS OF ADVENTURE</span><span>VERSION 1.0</span></div>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
  </main>
  <script src="./game.js" defer></script>
</body>
</html>
